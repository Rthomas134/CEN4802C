name: CI

# Runs on every push and pull request against main, and can also be triggered
# manually from the Actions tab (useful for the "successful CI run" screenshots).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtain the project's source code from the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the JDK that matches the project's build config
      #    (pom.xml compiles with <release>17</release>).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Run the project's EXISTING build lifecycle. `mvn clean package`
      #    reuses pom.xml as-is: Maven's lifecycle runs compile -> test
      #    (surefire) -> package (jar) in that order.
      - name: Build, test, and package with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      # 4. Surface the JUnit XML results as a native GitHub Actions check.
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

      # 5. Upload the packaged JAR as a build artifact so the "containerize"
      #    job below can download the exact jar this job already built and
      #    tested, instead of rebuilding it from scratch on a fresh runner.
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-tracker-jar
          path: target/*.jar
          if-no-files-found: error

  containerize:
    # This job only starts if build-and-test succeeds -- if the build or any
    # unit test fails, this job is skipped entirely, so a broken build never
    # produces a container image. This enforces the required pipeline shape:
    # Source -> Build -> Unit Tests -> Package -> Container Image.
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only publish an image for real pushes to main, not for every PR check
    # run (like the controlled-failure demo PR).
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      # Need the Dockerfile from the repo (this is a separate, fresh runner
      # from build-and-test, so nothing from that job's filesystem carries
      # over except what we explicitly pass via artifacts).
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pull down the exact jar that build-and-test already built and
      # tested -- this job does not rebuild or retest anything.
      - name: Download JAR artifact from build-and-test
        uses: actions/download-artifact@v4
        with:
          name: task-tracker-jar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rthomas134/task-tracker:latest
            ghcr.io/rthomas134/task-tracker:${{ github.sha }}