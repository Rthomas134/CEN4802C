# ---------------------------------------------------------------------------
# Task Tracker logging configuration (java.util.logging, built into the JDK)
#
# AppLogging.init() loads this file from the classpath at startup.
#
# Ways to change what gets recorded without touching the code:
#   1. Edit the levels below and rebuild (mvn clean package).
#   2. Set the LOG_LEVEL environment variable (or -Dlog.level=...) when
#      starting the app. It overrides the levels in this file:
#        LOG_LEVEL=FINE    -> debug detail (form fields, render stats, timings)
#        LOG_LEVEL=INFO    -> normal operations (default)
#        LOG_LEVEL=WARNING -> only problems
#   3. Point the JVM at a completely different file:
#        java -Djava.util.logging.config.file=my-logging.properties -jar ...
#
# Level guide used in this app (most to least severe):
#   SEVERE  - a request failed with an unexpected exception (HTTP 500)
#   WARNING - bad input or a request that could not be honored
#   INFO    - normal, meaningful events (task added/completed/deleted, requests)
#   CONFIG  - startup configuration details
#   FINE    - debug detail useful while troubleshooting
# ---------------------------------------------------------------------------

# Send log records to BOTH the console and a rotating log file.
handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Default level for everything (including JDK internals).
.level = INFO

# Level for the application's own loggers (tasktracker.*).
tasktracker.level = INFO

# --- Console: stdout/stderr, which is what `docker logs` and `kubectl logs` read.
java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# --- File: logs/task-tracker.0.log, rotated at 5 MB, keeping 5 files,
#     appended across restarts so history is kept between runs.
java.util.logging.FileHandler.pattern = logs/task-tracker.%g.log
java.util.logging.FileHandler.limit = 5000000
java.util.logging.FileHandler.count = 5
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# One line per entry: timestamp, level, logger name, message, then the stack
# trace (if any) on the following lines.
#   %1$ = timestamp  %3$ = logger name  %4$ = level  %5$ = message  %6$ = exception
java.util.logging.SimpleFormatter.format = %1$tF %1$tT.%1$tL %4$-7s [%3$s] %5$s%6$s%n
