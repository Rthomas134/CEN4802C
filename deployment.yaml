apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker
  labels:
    app: task-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-tracker
  template:
    metadata:
      labels:
        app: task-tracker
    spec:
      containers:
        - name: task-tracker
          image: ghcr.io/rthomas134/task-tracker:latest
          ports:
            - containerPort: 8080
          env:
            # Minimum log level for the app (SEVERE, WARNING, INFO, FINE).
            # Change it here and `kubectl apply -f deployment.yaml` to roll out
            # pods with more or less logging; view with `kubectl logs`.
            - name: LOG_LEVEL
              value: "INFO"
